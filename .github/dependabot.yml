# Dependabot version updates + security PRs
# Alerts: enable in Settings → Code security → Dependabot alerts (must be ON for the repo)
# Docs: https://docs.github.com/en/code-security/dependabot

version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Africa/Johannesburg
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - npm
    commit-message:
      prefix: "deps"
    groups:
      capacitor:
        patterns:
          - "@capacitor/*"
      vite-react:
        patterns:
          - "vite"
          - "@vitejs/*"
          - "react"
          - "react-dom"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Africa/Johannesburg
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "ci"
