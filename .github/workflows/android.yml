name: Android APK / AAB

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "debug | release | bundle"
        required: true
        default: debug
        type: choice
        options:
          - debug
          - release
          - bundle
  push:
    branches: [main, master]
    paths:
      - "src/**"
      - "capacitor.config.ts"
      - "package.json"
      - ".github/workflows/android.yml"
      - "scripts/android/**"
      - "scripts/build-android.sh"
      - "scripts/setup-android-signing.sh"

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android (${{ github.event.inputs.build_type || 'debug' }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Optional: create environment "android-release" in repo Settings for required reviewers
    environment: ${{ github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'bundle' && 'android-release' || '' }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install JS deps
        run: npm ci

      - name: Build web (dist/)
        run: npm run build

      - name: Add Capacitor Android platform
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Decode release keystore (release/bundle only)
        if: ${{ github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'bundle' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "Missing secret ANDROID_KEYSTORE_BASE64 — cannot sign release."
            echo "See docs/SECURITY_SIGNING.md"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > orange-groove-upload.jks
          mkdir -p android
          # No leading spaces — Properties loader is strict
          {
            echo "storePassword=${KEYSTORE_PASSWORD}"
            echo "keyPassword=${KEY_PASSWORD}"
            echo "keyAlias=${KEY_ALIAS:-orange-groove}"
            echo "storeFile=../orange-groove-upload.jks"
          } > android/key.properties
          chmod 600 android/key.properties orange-groove-upload.jks
          bash scripts/setup-android-signing.sh

      - name: Assemble Debug APK
        if: ${{ github.event.inputs.build_type != 'release' && github.event.inputs.build_type != 'bundle' }}
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Assemble Release APK
        if: ${{ github.event.inputs.build_type == 'release' }}
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Bundle Release AAB
        if: ${{ github.event.inputs.build_type == 'bundle' }}
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Upload debug APK
        if: ${{ github.event.inputs.build_type != 'release' && github.event.inputs.build_type != 'bundle' }}
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload release APK
        if: ${{ github.event.inputs.build_type == 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 7

      - name: Upload release AAB
        if: ${{ github.event.inputs.build_type == 'bundle' }}
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
          retention-days: 7

      - name: Cleanup keystore material
        if: always()
        run: |
          rm -f orange-groove-upload.jks orange-groove-release.jks
          rm -f android/key.properties android/app/key.properties
          shred -u orange-groove-upload.jks 2>/dev/null || true
